name: CI Pipeline              # 工作流名称（可选）
on:                            # 触发器：何时运行
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:                          # 作业：要执行的任务集合
  build:
    runs-on: ubuntu-latest     # 运行器环境
    steps:                     # 步骤：按顺序执行的命令
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run script
        run: echo "Hello, GitHub Actions!"
