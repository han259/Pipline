name: Download Label Studio Task (Async)

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create export snapshot and download
        env:
          LS_TOKEN: ${{ secrets.LABEL_STUDIO_TOKEN }}
          LS_HOST: "https://app.humansignal.com"
          PROJECT_ID: "269952"
          TASK_ID: "274190269"
        run: |
          set -e

          echo "===== 网络诊断信息 ====="
          echo "1. 环境变量代理检查:"
          env | grep -i proxy || echo "  未发现代理环境变量"

          echo "2. 系统级代理配置检查:"
          cat ~/.curlrc 2>/dev/null || echo "  未找到 ~/.curlrc 文件"

          echo "3. 直接连接测试 (绕过代理):"
          curl --noproxy "*" -sS -o /dev/null -w "  连接状态码: %{http_code}\n" https://app.humansignal.com || echo "  连接失败"

          echo "4. DNS 解析测试:"
          nslookup app.humansignal.com 2>&1 | head -5 || echo "  DNS 解析失败"
          echo "=========================="

          echo "创建导出任务..."
          BODY="{\"exportType\": \"JSON\", \"task_filter_options\": {\"ids\": [$TASK_ID]}}"

          # 核心修复: 使用 env -u 强制清除所有代理变量
          RESPONSE=$(env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u all_proxy \
            curl --noproxy "*" -sS -X POST \
            "$LS_HOST/api/projects/$PROJECT_ID/exports/" \
            -H "Authorization: Token $LS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          EXPORT_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          if [ -z "$EXPORT_ID" ]; then
            echo "创建导出任务失败。响应: $RESPONSE"
            exit 1
          fi
          echo "导出任务已创建，ID: $EXPORT_ID"

          echo "轮询导出状态..."
          MAX_ATTEMPTS=60
          ATTEMPT=0
          STATUS="created"

          while [ "$STATUS" != "completed" ] && [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            sleep 5
            ATTEMPT=$((ATTEMPT + 1))

            STATUS_RESPONSE=$(env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u all_proxy \
              curl --noproxy "*" -sS -X GET \
              "$LS_HOST/api/projects/$PROJECT_ID/exports/$EXPORT_ID" \
              -H "Authorization: Token $LS_TOKEN")

            STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status // "unknown"')
            echo "第 $ATTEMPT/$MAX_ATTEMPTS 次 - 状态: $STATUS"

            if [ "$STATUS" = "failed" ]; then
              echo "导出失败。响应: $STATUS_RESPONSE"
              exit 1
            fi
          done

          if [ "$STATUS" != "completed" ]; then
            echo "导出超时 (已尝试 $MAX_ATTEMPTS 次)"
            exit 1
          fi
          echo "导出成功完成!"

          echo "正在下载导出文件..."
          env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u all_proxy \
            curl --noproxy "*" -sS -X GET \
            "$LS_HOST/api/projects/$PROJECT_ID/exports/$EXPORT_ID/download" \
            -H "Authorization: Token $LS_TOKEN" \
            --output task_export.json

          echo "文件大小: $(wc -c < task_export.json) bytes"
          head -c 200 task_export.json
          echo ""

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: label-studio-export
          path: task_export.json
