name: Download Label Studio Task (Async)

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create export snapshot and download
        env:
          LS_TOKEN: ${{ secrets.LABEL_STUDIO_TOKEN }}
          LS_HOST: "https://app.humansignal.com"
          PROJECT_ID: "269952"
          TASK_ID: "274190269"
        run: |
          set -e

          echo "创建导出任务..."
          BODY="{\"exportType\": \"JSON\", \"task_filter_options\": {\"ids\": [$TASK_ID]}}"
          RESPONSE=$(env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u all_proxy \
            curl --noproxy "*" -sS -L -X POST \
            "$LS_HOST/api/projects/$PROJECT_ID/exports/" \
            -H "Authorization: Token $LS_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$BODY")

          echo "创建响应: $RESPONSE"

          # 尝试提取 export_pk 或 id
          EXPORT_ID=$(echo "$RESPONSE" | jq -r '.export_pk // .id // empty' 2>/dev/null || echo "")
          if [ -z "$EXPORT_ID" ]; then
            echo "无法提取导出 ID，响应: $RESPONSE"
            exit 1
          fi
          echo "使用导出 ID: $EXPORT_ID"

          echo "轮询导出状态..."
          MAX_ATTEMPTS=30
          ATTEMPT=0
          STATUS="created"

          while [ "$STATUS" != "completed" ] && [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            sleep 5
            ATTEMPT=$((ATTEMPT + 1))

            # 关键修改：加上尾斜杠
            STATUS_RESPONSE=$(env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u all_proxy \
              curl --noproxy "*" -sS -L -X GET \
              "$LS_HOST/api/projects/$PROJECT_ID/exports/$EXPORT_ID/" \
              -H "Authorization: Token $LS_TOKEN" \
              -H "Accept: application/json")

            echo "DEBUG: 轮询原始响应: $STATUS_RESPONSE"

            STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")
            echo "第 $ATTEMPT/$MAX_ATTEMPTS 次 - 状态: $STATUS"

            if [ "$STATUS" = "failed" ]; then
              echo "导出失败。"
              exit 1
            fi
          done

          if [ "$STATUS" != "completed" ]; then
            echo "导出超时。"
            exit 1
          fi

          echo "下载导出文件..."
          env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u all_proxy \
            curl --noproxy "*" -sS -L -X GET \
            "$LS_HOST/api/projects/$PROJECT_ID/exports/$EXPORT_ID/download" \
            -H "Authorization: Token $LS_TOKEN" \
            --output task_export.json

          echo "下载完成，文件大小: $(wc -c < task_export.json) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: label-studio-export
          path: task_export.json
