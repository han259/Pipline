name: Download Label Studio Task (Async)

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create export snapshot and download
        env:
          LS_TOKEN: ${{ secrets.LABEL_STUDIO_TOKEN }}
          LS_HOST: "https://app.humansignal.com"
          PROJECT_ID: "269952"
          TASK_ID: "274190269"
        run: |
          set -e

          echo "===== Proxy environment variables ====="
          env | grep -i proxy || true
          echo "======================================="

          # 额外保险：主动清除可能存在的代理变量
          unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY || true

          echo "Creating export snapshot for project $PROJECT_ID, task $TASK_ID..."
          BODY="{\"exportType\": \"JSON\", \"task_filter_options\": {\"ids\": [$TASK_ID]}}"
          RESPONSE=$(curl --noproxy "*" -sS -X POST \
            "$LS_HOST/api/projects/$PROJECT_ID/exports/" \
            -H "Authorization: Token $LS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          EXPORT_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          if [ -z "$EXPORT_ID" ]; then
            echo "Failed to create export. Response: $RESPONSE"
            exit 1
          fi
          echo "Export created with ID: $EXPORT_ID"

          echo "Polling export status..."
          MAX_ATTEMPTS=60
          ATTEMPT=0
          STATUS="created"

          while [ "$STATUS" != "completed" ] && [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            sleep 5
            ATTEMPT=$((ATTEMPT + 1))
            STATUS_RESPONSE=$(curl --noproxy "*" -sS -X GET \
              "$LS_HOST/api/projects/$PROJECT_ID/exports/$EXPORT_ID" \
              -H "Authorization: Token $LS_TOKEN")
            STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status // "unknown"')
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS - Status: $STATUS"

            if [ "$STATUS" = "failed" ]; then
              echo "Export failed. Response: $STATUS_RESPONSE"
              exit 1
            fi
          done

          if [ "$STATUS" != "completed" ]; then
            echo "Export timed out after $MAX_ATTEMPTS attempts."
            exit 1
          fi
          echo "Export completed successfully!"

          echo "Downloading export file..."
          curl --noproxy "*" -sS -X GET \
            "$LS_HOST/api/projects/$PROJECT_ID/exports/$EXPORT_ID/download" \
            -H "Authorization: Token $LS_TOKEN" \
            --output task_export.json

          echo "File size: $(wc -c < task_export.json) bytes"
          head -c 200 task_export.json
          echo ""

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: label-studio-export
          path: task_export.json
