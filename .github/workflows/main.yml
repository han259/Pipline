name: Download Label Studio Task

on:
  workflow_dispatch:          # 支持手动触发
  push:
    branches: [main]

jobs:
  download-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Label Studio JSON
        env:
          LS_TOKEN: ${{ secrets.LABEL_STUDIO_TOKEN }}   # 从 GitHub Secrets 读取
        run: |
          curl -X GET "https://your-label-studio-host/api/projects/1/export?ids[]=123&exportType=JSON" \
            -H "Authorization: Token $LS_TOKEN" \
            --output task_export.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: label-studio-export
          path: task_export.json
