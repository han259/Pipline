name: Download Label Studio Task

on:
  workflow_dispatch:  # 支持手动触发

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download task JSON
        env:
          LS_TOKEN: ${{ secrets.LABEL_STUDIO_TOKEN }}
        run: |
          curl -X GET "https://app.humansignal.com/api/projects/269952/export?ids[]=274190269&exportType=JSON" \
            -H "Authorization: Token $LS_TOKEN" \
            --output task_export.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: label-studio-export
          path: task_export.json
